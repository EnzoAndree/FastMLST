version: 2.1

orbs:
  python: circleci/python@0.2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.8.5
    steps:
      - checkout
      - run:
          command: |
            python --version
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install .
            export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path(\"scripts\"))'):$PATH"
            fastmlst -V
